# Messages and prompts, drawn as a pill on the bar instead of a full-width coloured line.
#  - message-style is the base: the bar colour. It is also what text you type into a prompt uses.
#  - message-format draws the pill around the message (or the prompt's label). The inline fill=
#    clears the rest of the row, so no half-covered status bar shows through.
# Sourced after the theme at load and again by the attach hook, because the theme files set
# message-style too.
set -gF message-style         "bg=#{@noctalia_surface_container_low},fg=#{@noctalia_on_surface}"
set -gF message-command-style "bg=#{@noctalia_surface_container_low},fg=#{@noctalia_on_surface}"
set -g message-format "#[fill=#{@noctalia_surface_container_low}]#[fg=#{?command_prompt,#{@noctalia_secondary_container},#{@noctalia_primary_container}},bg=#{@noctalia_surface_container_low}]#[fg=#{?command_prompt,#{@noctalia_on_secondary_container},#{@noctalia_on_primary_container}},bg=#{?command_prompt,#{@noctalia_secondary_container},#{@noctalia_primary_container}}] #{message} #[fg=#{?command_prompt,#{@noctalia_secondary_container},#{@noctalia_primary_container}},bg=#{@noctalia_surface_container_low}]"
