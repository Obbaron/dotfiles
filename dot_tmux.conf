# .tmux.conf

# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config (<prefix> r)
unbind r
bind-key r source-file ~/.tmux.conf \; display-message ".tmux.conf reloaded"

# Mouse mode
set -g mouse on

# Navigation (prefix + hjkl)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Window and pane numbering
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set-window-option -g pane-base-index 1

# Resize panes
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Maximize pane
bind -r m resize-pane -Z

# Kill pane - no confirm
bind-key x kill-pane

# Copy mode (vi)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Splits (keep current working directory)
bind-key / split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Windows
# <prefix> Tab       = last window (repeatable)
# <prefix> Shift-Tab = new window in current directory
# <prefix> 1..9      = jump to window (tmux default)
bind -r Tab last-window
bind BTab new-window -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

bind C-g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-o display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind C-y display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "yazi"
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "bash"

### STATUS BAR (native layout, colors from Noctalia) ###
# Colors come from @noctalia_* variables (fallbacks below, overridden by noctalia.conf).
# No -F on the formats below, so they re-resolve on every redraw.

set -g status on
set -g status-position top
set -g status-justify absolute-centre
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator " "

# Left: session pill (tertiary normally, error color while prefix is active)
set -g status-left "#[fg=#{?client_prefix,#{@noctalia_error_container},#{@noctalia_tertiary_container}},bg=#{@noctalia_surface_container_low}]#[fg=#{?client_prefix,#{@noctalia_on_error_container},#{@noctalia_on_tertiary_container}},bg=#{?client_prefix,#{@noctalia_error_container},#{@noctalia_tertiary_container}}] 󰆍 #[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_high}] #S #[fg=#{@noctalia_surface_container_high},bg=#{@noctalia_surface_container_low}]"

# Center: inactive window (number block + name block)
set -g window-status-format "#[fg=#{@noctalia_surface_container_highest},bg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_highest}]#I #[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container}] #W #[fg=#{@noctalia_surface_container},bg=#{@noctalia_surface_container_low}]"

# Center: current window (primary number block, brighter name block)
set -g window-status-current-format "#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary}]#I #[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_highest}] #W #[fg=#{@noctalia_surface_container_highest},bg=#{@noctalia_surface_container_low}]"

# Right: user pill
set -g status-right "#[fg=#{@noctalia_secondary_container},bg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_secondary_container},bg=#{@noctalia_secondary_container}]  #[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_high}] #(whoami) #[fg=#{@noctalia_surface_container_high},bg=#{@noctalia_surface_container_low}]"

### PLUGGINS ###
set -g @plugin 'tmux-plugins/tpm'
# Replaced by the native status bar above
# set -g @plugin 'catppuccin/tmux'
# Replaced by the manual smart-pane-switching block above
# set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.org:user/plugin'

run '~/.tmux/plugins/tpm/tpm'

### THEME FALLBACKS (used when noctalia.conf is missing) ###
# Defaults are Catppuccin Mocha. If noctalia.conf exists, it is sourced after
# this block and overwrites everything here.

# Palette (Noctalia role -> Mocha color)
set -g @noctalia_surface                      "#181825"  # mantle
set -g @noctalia_on_surface                   "#cdd6f4"  # text
set -g @noctalia_surface_container_low        "#1e1e2e"  # base (bar background)
set -g @noctalia_surface_container            "#313244"  # surface0
set -g @noctalia_surface_container_high       "#45475a"  # surface1
set -g @noctalia_surface_container_highest    "#585b70"  # surface2
set -g @noctalia_on_surface_variant           "#a6adc8"  # subtext0
set -g @noctalia_outline                      "#6c7086"  # overlay0
set -g @noctalia_outline_variant              "#45475a"  # surface1
set -g @noctalia_primary                      "#cba6f7"  # mauve
set -g @noctalia_on_primary                   "#11111b"  # crust
set -g @noctalia_primary_container            "#89b4fa"  # blue
set -g @noctalia_on_primary_container         "#11111b"  # crust
set -g @noctalia_secondary_container          "#fab387"  # peach
set -g @noctalia_on_secondary_container       "#11111b"  # crust
set -g @noctalia_tertiary_container           "#a6e3a1"  # green
set -g @noctalia_on_tertiary_container        "#11111b"  # crust
set -g @noctalia_error_container              "#f38ba8"  # red
set -g @noctalia_on_error_container           "#11111b"  # crust

# Global styles (the ones noctalia.conf normally sets)
set -gqF status-style                  "bg=#{@noctalia_surface_container_low},fg=#{@noctalia_on_surface}"
set -gqF window-status-style           "fg=#{@noctalia_on_surface_variant}"
set -gqF window-status-current-style   "bg=#{@noctalia_surface_container_highest},fg=#{@noctalia_on_surface},bold"
set -gqF window-status-last-style      "fg=#{@noctalia_on_surface},bold"
set -gqF window-status-activity-style  "bg=#{@noctalia_tertiary_container},fg=#{@noctalia_on_tertiary_container}"
set -gqF window-status-bell-style      "bg=#{@noctalia_error_container},fg=#{@noctalia_on_error_container},bold"
set -gqF pane-border-style             "fg=#{@noctalia_outline_variant}"
set -gqF pane-active-border-style      "fg=#{@noctalia_primary}"
set -gqF mode-style                    "bg=#{@noctalia_secondary_container},fg=#{@noctalia_on_secondary_container},bold"
set -gqF message-style                 "bg=#{@noctalia_primary_container},fg=#{@noctalia_on_primary_container}"
set -gqF message-command-style         "bg=#{@noctalia_primary_container},fg=#{@noctalia_on_primary_container}"
set -gqF popup-style                   "bg=#{@noctalia_surface},fg=#{@noctalia_on_surface}"
set -gqF popup-border-style            "fg=#{@noctalia_outline}"
set -gqF menu-style                    "bg=#{@noctalia_surface_container_high},fg=#{@noctalia_on_surface}"
set -gqF menu-selected-style           "bg=#{@noctalia_primary},fg=#{@noctalia_on_primary},bold"
set -gqF menu-border-style             "fg=#{@noctalia_outline}"
set -gqF copy-mode-match-style         "bg=#{@noctalia_tertiary_container},fg=#{@noctalia_on_tertiary_container}"
set -gqF copy-mode-current-match-style "bg=#{@noctalia_primary_container},fg=#{@noctalia_on_primary_container},bold"
set -gqF copy-mode-selection-style     "bg=#{@noctalia_secondary_container},fg=#{@noctalia_on_secondary_container}"
set -gqF clock-mode-colour             "#{@noctalia_primary}"

# Must stay last: overrides the fallbacks above when present
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
