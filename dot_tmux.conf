# .tmux.conf

# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config (<prefix> r)
unbind r
bind -N "wk:Reload config" r source-file ~/.tmux.conf \; display-message ".tmux.conf reloaded"

# Keybinds cheet sheet (<prefix> Space)
bind -N "Keybinds cheat sheet" Space display-popup -E -b rounded -w 90% -h 85% -T " Keybinds " "~/.config/tmux/which-key.sh"

# Mouse mode
set -g mouse on

# Navigation (prefix + hjkl)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Window and pane numbering
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set-window-option -g pane-base-index 1
bind R command-prompt -I "#W" "rename-window '%%'"

# Resize panes
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Maximize pane
bind -N "wk:Zoom pane" -r m resize-pane -Z

# Kill pane - no confirm
bind -N "wk:Kill pane" x kill-pane

# Copy mode (vi)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Vim split aware pane switching
# yoinked from here: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Splits (keep current working directory)
bind -N "wk:Split right" / split-window -h -c "#{pane_current_path}"
bind -N "wk:Split below" - split-window -v -c "#{pane_current_path}"

# Windows
# <prefix> Tab       = last window (repeatable)
# <prefix> Shift-Tab = new window in current directory
# <prefix> 1..9      = jump to window (tmux default)
bind -N "wk:Last window" -r Tab last-window
bind -N "wk:New window" BTab new-window -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
# <prefix> ( / )   = previous / next window (replaces the default session switching)
bind -r '(' previous-window
bind -r ')' next-window

# Sessions
# <prefix> D = kill session and switch to "default" (does nothing inside "default")
bind D if-shell -F '#{==:#{session_name},default}' \
  'display-message "Already in default session"' \
  'run-shell "tmux has-session -t =default 2>/dev/null || tmux new-session -d -s default -c ~; tmux switch-client -c \"#{client_name}\" -t =default; tmux kill-session -t \"=#{session_name}\""'

# :vim = split right and open nvim
set -s command-alias[100] 'vim=split-window -h -l 60% -c "#{pane_current_path}" nvim'
bind v vim

# Popups
bind -N "wk:Lazygit" g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"

bind -N "Config manager" , display-popup -w 85% -h 85% -T " Config " -E "~/.config/tmux/config-manager.sh"

bind n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'

bind -N "Session manager" o display-popup -w 50% -h 50% -E "~/.config/tmux/session-switcher.sh"

bind -N "wk:Yazi" y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi"

bind t display-popup -d "#{pane_current_path}" -w 75% -h 75% -E "bash"


### STATUS BAR ###
# Colors come from @noctalia_* variables (see THEME below)

set -g status on
set -g status-position top
set -g status-justify absolute-centre
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator " "

# Left: session pill (tertiary normally, error color while prefix is active)
set -g status-left "#[fg=#{?client_prefix,#{@noctalia_error_container},#{@noctalia_tertiary_container}},bg=#{@noctalia_surface_container_low}]#[fg=#{?client_prefix,#{@noctalia_on_error_container},#{@noctalia_on_tertiary_container}},bg=#{?client_prefix,#{@noctalia_error_container},#{@noctalia_tertiary_container}}]󰆍 #[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_high}] #S#[fg=#{@noctalia_surface_container_high},bg=#{@noctalia_surface_container_low}]"

# Center: inactive window (number block + name block)
set -g window-status-format "#[fg=#{@noctalia_surface_container_highest},bg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_highest}]#I #[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container}] #W#[fg=#{@noctalia_surface_container},bg=#{@noctalia_surface_container_low}]"

# Center: current window (primary number block, brighter name block)
set -g window-status-current-format "#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary}]#I #[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_highest}] #W#[fg=#{@noctalia_surface_container_highest},bg=#{@noctalia_surface_container_low}]"

# Right: user pill
set -g status-right "#[fg=#{@noctalia_secondary_container},bg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_secondary_container},bg=#{@noctalia_secondary_container}] #[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_high}] #(whoami)#[fg=#{@noctalia_surface_container_high},bg=#{@noctalia_surface_container_low}]"


