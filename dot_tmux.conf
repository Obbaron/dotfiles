### THEME ###
# mocha.conf always loads as the base; noctalia overrides locally, not over SSH
source-file -q "$HOME/.config/tmux/themes/mocha.conf"
if-shell '[ -z "$SSH_CONNECTION" ]' \
  'source-file -q "$HOME/.config/tmux/themes/noctalia.conf"'

set-hook -g client-attached 'run-shell "if grep -qa ^SSH_CONNECTION= /proc/#{client_pid}/environ 2>/dev/null; then tmux source-file -q ~/.config/tmux/themes/mocha.conf; else tmux source-file -q ~/.config/tmux/themes/noctalia.conf; fi"'
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
